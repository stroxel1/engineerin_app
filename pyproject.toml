[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-app"
version = "0.2.0"
description = "Citric process engineering workbook inspection and calculation toolkit"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1",
  "streamlit>=1.40",
  "pandas>=2.0",
  "plotly>=5.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["engineering_app*"]
